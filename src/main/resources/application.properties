spring.application.name=TeamForge

# MySQL Database
spring.datasource.url=${TEAMFORGE_DB_URL:jdbc:mysql://localhost:3306/teamforge_db}
spring.datasource.username=${TEAMFORGE_DB_USERNAME:root}
spring.datasource.password=${TEAMFORGE_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8081}

# JWT Authentication
teamforge.jwt.secret=${TEAMFORGE_JWT_SECRET}
